<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12172c">
  <meta name="description" content="Poké-Mario: ein Jump'n'Run-Abenteuer mit Pokémon.">
  <title>Poké-Mario</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #12172c; color: #fff; font-family: system-ui, sans-serif; }
    main { width: min(100%, 540px); text-align: center; }
    h1 { margin: 0; font-size: clamp(2.5rem, 12vw, 5rem); line-height: 1; letter-spacing: -.06em; text-shadow: 0 5px 0 #26345e; }
    p { margin: 18px 0 28px; color: #c8d2f0; font-size: 1.05rem; }
    button { min-height: 54px; padding: 12px 30px; border: 2px solid #ffe27a; border-radius: 12px; background: #f4bf35; color: #241d13; font: 700 1.15rem system-ui, sans-serif; cursor: pointer; box-shadow: 0 5px 0 #a86d19; }
    button:hover { background: #ffda58; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    #loading { min-height: 1.5em; margin-top: 22px; color: #c8d2f0; }
    noscript { display: block; margin-top: 24px; color: #ffc4b8; }
  </style>
</head>
<body>
  <main id="start-screen">
    <h1>Poké-Mario</h1>
    <p>Ein Jump'n'Run-Abenteuer mit Pokémon</p>
    <button id="start" type="button">Spiel starten</button>
    <div id="loading" role="status" aria-live="polite"></div>
    <noscript>Zum Spielen JavaScript aktivieren.</noscript>
  </main>
  <script>
    (() => {
      const button = document.getElementById('start');
      const status = document.getElementById('loading');
      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = 'Spiel wird geladen …';
        const screen = document.getElementById('start-screen');
        document.body.classList.add('playing');
        const game = document.createElement('main');
        game.id = 'game-screen';
        game.innerHTML = '<div class="game-loading" role="status">Spiel wird geladen …</div>';
        screen.replaceWith(game);
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './assets/game.95a15eee1a586a16.css';
        document.head.append(css);
        game.insertAdjacentHTML('beforeend', '<canvas id="game" width="800" height="480" aria-label="Poké-Mario-Spiel"></canvas><div id="hint"><kbd>←</kbd> <kbd>→</kbd> laufen &nbsp; <kbd>Space</kbd>/<kbd>↑</kbd> springen &nbsp; <kbd>X</kbd> Pokéball werfen &nbsp; <kbd>1</kbd>–<kbd>6</kbd> Team wählen &nbsp; <kbd>↓</kbd> Tür/Rohr betreten<br>Im Kampf: <kbd>Pfeile</kbd> Menü &nbsp; <kbd>Space</kbd>/<kbd>Enter</kbd> bestätigen &nbsp; <kbd>Esc</kbd> zurück</div>');
        try {
          await new Promise((resolve, reject) => {
            css.onload = resolve;
            css.onerror = () => reject(new Error('Das Spiel-Layout konnte nicht geladen werden.'));
          });
          const script = document.createElement('script');
          script.src = './assets/game.639ec47e884af177.js';
          script.defer = true;
          await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = () => reject(new Error('Das Spiel konnte nicht geladen werden.'));
            document.body.append(script);
          });
          game.querySelector('.game-loading')?.remove();
          if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
        } catch (error) {
          game.innerHTML = `<p role="alert">${error.message} Bitte Seite neu laden und erneut versuchen.</p>`;
        }
      }, { once: true });
      if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}), { once: true });
    })();
  </script>
</body>
</html>
